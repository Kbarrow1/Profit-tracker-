<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Profit Tracker</title>
<meta name="description" content="A daily P&amp;L calendar and trading statistics tracker.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12151b">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Profit Tracker">
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#12151b;
    --panel:#181c24;
    --panel-2:#1f242e;
    --ledger-line:#252b36;
    --text:#e7eaf0;
    --muted:#8a93a3;
    --profit:#35c787;
    --profit-dim:#1f7a52;
    --loss:#ff5c5c;
    --loss-dim:#9c3535;
    --amber:#f0b429;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  #app{max-width:440px;margin:0 auto;padding:14px 14px 90px;min-height:100vh;}

  .header{padding:6px 2px 14px;}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;}
  .title{font-size:20px;font-weight:700;margin:2px 0 14px;}

  .total-card{
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--ledger-line);
    border-radius:14px;
    padding:16px 18px;
    display:flex;justify-content:space-between;align-items:flex-end;
    margin-bottom:14px;
  }
  .total-label{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;}
  .total-value{font-family:var(--mono);font-size:30px;font-weight:700;line-height:1;margin-top:6px;}
  .total-sub{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;}
  .pos{color:var(--profit);}
  .neg{color:var(--loss);}
  .zero{color:var(--muted);}

  .month-nav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px;}
  .month-nav button{
    background:var(--panel-2);border:1px solid var(--ledger-line);color:var(--text);
    width:34px;height:34px;border-radius:9px;font-size:16px;line-height:1;
  }
  .month-label{font-weight:600;font-size:15px;}

  .cal{background:var(--panel);border:1px solid var(--ledger-line);border-radius:14px;overflow:hidden;padding:8px;}
  .weekday-row{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;}
  .weekday{text-align:center;font-family:var(--mono);font-size:10px;color:var(--muted);padding:4px 0;}
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px;}
  .day{
    position:relative;aspect-ratio:1/1;border-radius:8px;border:1px solid var(--ledger-line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:var(--mono);cursor:pointer;overflow:hidden;
  }
  .day.empty{visibility:hidden;}
  .day .num{position:absolute;top:3px;left:5px;font-size:9px;color:var(--muted);}
  .day.has-num .num{color:rgba(255,255,255,.55);}
  .day .val{font-size:11px;font-weight:700;margin-top:6px;}
  .day.today{border-color:var(--amber);}

  .toggle-row{display:flex;gap:6px;margin:16px 0 10px;}
  .toggle{flex:1;text-align:center;padding:8px 0;border-radius:9px;border:1px solid var(--ledger-line);
    background:var(--panel);color:var(--muted);font-size:12px;font-weight:600;}
  .toggle.active{background:var(--panel-2);color:var(--text);border-color:var(--amber);}

  .stats{background:var(--panel);border:1px solid var(--ledger-line);border-radius:14px;padding:4px 14px;}
  .stat-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--ledger-line);}
  .stat-row:last-child{border-bottom:none;}
  .stat-label{font-size:12.5px;color:var(--muted);}
  .stat-value{font-family:var(--mono);font-size:13.5px;font-weight:700;}

  .export-bar{
    position:fixed;bottom:0;left:0;right:0;
    background:linear-gradient(180deg,rgba(18,21,27,0),var(--bg) 30%);
    padding:18px 14px calc(14px + env(safe-area-inset-bottom));
    display:flex;justify-content:center;
  }
  .export-btn{
    max-width:412px;width:100%;
    background:var(--amber);color:#1a1400;border:none;border-radius:12px;
    padding:13px 0;font-weight:700;font-size:14px;font-family:var(--sans);
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .export-btn:active{opacity:.85;}

  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;
    opacity:0;pointer-events:none;transition:opacity .15s;z-index:20;
  }
  .overlay.open{opacity:1;pointer-events:auto;}
  .sheet{
    width:100%;max-width:440px;margin:0 auto;background:var(--panel-2);
    border-radius:16px 16px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(100%);transition:transform .18s;
  }
  .overlay.open .sheet{transform:translateY(0);}
  .sheet-date{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:10px;}
  .sheet input{
    width:100%;background:var(--bg);border:1px solid var(--ledger-line);border-radius:10px;
    color:var(--text);font-family:var(--mono);font-size:22px;padding:12px 14px;margin-bottom:12px;
  }
  .sheet-btns{display:flex;gap:8px;}
  .sheet-btns button{flex:1;padding:12px 0;border-radius:10px;border:none;font-weight:700;font-size:13px;font-family:var(--sans);}
  .btn-save{background:var(--amber);color:#1a1400;}
  .btn-clear{background:var(--panel);color:var(--loss);border:1px solid var(--ledger-line) !important;}
  .btn-cancel{background:var(--panel);color:var(--muted);border:1px solid var(--ledger-line) !important;}

  .toast{
    position:fixed;top:14px;left:50%;transform:translateX(-50%);
    background:var(--panel-2);border:1px solid var(--ledger-line);color:var(--text);
    padding:9px 16px;border-radius:20px;font-size:12.5px;opacity:0;transition:opacity .2s;z-index:30;
  }
  .toast.show{opacity:1;}
</style>

<div id="app"></div>
<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-date" id="sheetDate">—</div>
    <input id="sheetInput" type="number" inputmode="decimal" placeholder="£ profit or loss" />
    <div class="sheet-btns">
      <button class="btn-cancel" id="btnCancel">Cancel</button>
      <button class="btn-clear" id="btnClear">Clear</button>
      <button class="btn-save" id="btnSave">Save</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="export-bar">
  <button class="export-btn" id="exportBtn">⇩ Export to Excel</button>
</div>

<script>
const STORAGE_KEY = 'pnl-entries';
const now = new Date();
let entries = {};
let viewYear = now.getFullYear();
let viewMonth = now.getMonth(); // 0-indexed
let statsScope = 'month'; // 'month' | 'all'
let activeDateKey = null;
let loaded = false;

const fmtGBP = (v, forceSign=false) => {
  const abs = Math.abs(Math.round(v));
  const s = '£' + abs.toLocaleString('en-GB');
  if (v > 0) return (forceSign ? '+' : '') + s;
  if (v < 0) return '-' + s;
  return s;
};
const pad2 = n => String(n).padStart(2,'0');
const dateKey = (y,m,d) => `${y}-${pad2(m+1)}-${pad2(d)}`;

function getMonthMatrix(year, month){
  const first = new Date(year, month, 1);
  const startWeekday = (first.getDay() + 6) % 7; // Monday=0
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const cells = [];
  for(let i=0;i<startWeekday;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push({day:d, key:dateKey(year,month,d)});
  while(cells.length % 7 !== 0) cells.push(null);
  const weeks = [];
  for(let i=0;i<cells.length;i+=7) weeks.push(cells.slice(i,i+7));
  return weeks;
}

function computeStats(scopeEntries){
  const vals = Object.values(scopeEntries).filter(v => typeof v === 'number' && !isNaN(v));
  const wins = vals.filter(v=>v>0);
  const losses = vals.filter(v=>v<0);
  const daysTraded = vals.length;
  const total = vals.reduce((a,b)=>a+b,0);
  const winRate = daysTraded ? wins.length/daysTraded : 0;
  const avgDaily = daysTraded ? total/daysTraded : 0;
  const sumWins = wins.reduce((a,b)=>a+b,0);
  const sumLosses = losses.reduce((a,b)=>a+b,0);
  const avgWin = wins.length ? sumWins/wins.length : 0;
  const avgLoss = losses.length ? sumLosses/losses.length : 0;
  const best = vals.length ? Math.max(...vals) : 0;
  const worst = vals.length ? Math.min(...vals) : 0;
  const profitFactor = sumLosses !== 0 ? sumWins/Math.abs(sumLosses) : (sumWins>0 ? Infinity : 0);
  const expectancy = (winRate*avgWin) + ((1-winRate)*avgLoss);
  return {daysTraded, winDays:wins.length, lossDays:losses.length, winRate, total, avgDaily, avgWin, avgLoss, best, worst, profitFactor, expectancy};
}

function entriesForMonth(y,m){
  const prefix = `${y}-${pad2(m+1)}-`;
  const out = {};
  Object.keys(entries).forEach(k=>{ if(k.startsWith(prefix)) out[k]=entries[k]; });
  return out;
}
function entriesForYear(y){
  const prefix = `${y}-`;
  const out = {};
  Object.keys(entries).forEach(k=>{ if(k.startsWith(prefix)) out[k]=entries[k]; });
  return out;
}

function maxAbsAll(){
  const vals = Object.values(entries).filter(v=>typeof v==='number');
  if(!vals.length) return 100;
  return Math.max(...vals.map(v=>Math.abs(v)), 1);
}

function pnlBg(v, maxAbs){
  if(v === undefined || v === null) return 'transparent';
  const alpha = Math.min(0.85, 0.15 + 0.7*Math.abs(v)/maxAbs);
  return v >= 0 ? `rgba(53,199,135,${alpha})` : `rgba(255,92,92,${alpha})`;
}

function monthLabel(y,m){
  return new Date(y,m,1).toLocaleString('en-GB',{month:'long', year:'numeric'});
}

function render(){
  const app = document.getElementById('app');
  const monthEntries = entriesForMonth(viewYear, viewMonth);
  const yearEntries = entriesForYear(viewYear);
  const monthStats = computeStats(monthEntries);
  const yearStats = computeStats(yearEntries);
  const maxAbs = maxAbsAll();
  const isToday = (y,m,d) => y===now.getFullYear() && m===now.getMonth() && d===now.getDate();

  const weeks = getMonthMatrix(viewYear, viewMonth);
  const weekdayLabels = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  const scope = statsScope === 'month' ? monthStats : yearStats;
  const scopeLabel = statsScope === 'month' ? monthLabel(viewYear,viewMonth) : String(viewYear);

  app.innerHTML = `
    <div class="header">
      <div class="eyebrow">Trading Journal</div>
      <div class="title">Profit Tracker</div>
    </div>

    <div class="total-card">
      <div>
        <div class="total-label">${viewYear} total</div>
        <div class="total-value ${yearStats.total>0?'pos':yearStats.total<0?'neg':'zero'}">${fmtGBP(yearStats.total, true)}</div>
      </div>
      <div class="total-sub">${yearStats.daysTraded} days · ${(yearStats.winRate*100).toFixed(0)}% win rate</div>
    </div>

    <div class="month-nav">
      <button id="prevMonth">‹</button>
      <div class="month-label">${monthLabel(viewYear, viewMonth)}</div>
      <button id="nextMonth">›</button>
    </div>

    <div class="cal">
      <div class="weekday-row">${weekdayLabels.map(w=>`<div class="weekday">${w}</div>`).join('')}</div>
      ${weeks.map(week => `
        <div class="week">
          ${week.map(cell=>{
            if(!cell) return `<div class="day empty"></div>`;
            const v = entries[cell.key];
            const has = typeof v === 'number';
            const bg = pnlBg(v, maxAbs);
            const todayCls = isToday(viewYear,viewMonth,cell.day) ? 'today' : '';
            return `<div class="day ${has?'has-num':''} ${todayCls}" style="background:${bg}" data-key="${cell.key}">
              <span class="num">${cell.day}</span>
              ${has ? `<span class="val">${fmtGBP(v)}</span>` : ''}
            </div>`;
          }).join('')}
        </div>
      `).join('')}
    </div>

    <div class="toggle-row">
      <div class="toggle ${statsScope==='month'?'active':''}" id="toggleMonth">This month</div>
      <div class="toggle ${statsScope==='all'?'active':''}" id="toggleAll">${viewYear} total</div>
    </div>

    <div class="stats">
      <div class="stat-row"><span class="stat-label">Days traded</span><span class="stat-value">${scope.daysTraded}</span></div>
      <div class="stat-row"><span class="stat-label">Win rate</span><span class="stat-value">${(scope.winRate*100).toFixed(1)}%</span></div>
      <div class="stat-row"><span class="stat-label">Total P&L</span><span class="stat-value ${scope.total>0?'pos':scope.total<0?'neg':''}">${fmtGBP(scope.total,true)}</span></div>
      <div class="stat-row"><span class="stat-label">Avg daily P&L</span><span class="stat-value ${scope.avgDaily>0?'pos':scope.avgDaily<0?'neg':''}">${fmtGBP(scope.avgDaily,true)}</span></div>
      <div class="stat-row"><span class="stat-label">Avg win / loss</span><span class="stat-value"><span class="pos">${fmtGBP(scope.avgWin)}</span> / <span class="neg">${fmtGBP(scope.avgLoss)}</span></span></div>
      <div class="stat-row"><span class="stat-label">Best / worst day</span><span class="stat-value"><span class="pos">${fmtGBP(scope.best)}</span> / <span class="neg">${fmtGBP(scope.worst)}</span></span></div>
      <div class="stat-row"><span class="stat-label">Profit factor</span><span class="stat-value">${isFinite(scope.profitFactor)?scope.profitFactor.toFixed(2):'∞'}</span></div>
      <div class="stat-row"><span class="stat-label">Expectancy / day</span><span class="stat-value ${scope.expectancy>0?'pos':scope.expectancy<0?'neg':''}">${fmtGBP(scope.expectancy,true)}</span></div>
    </div>
  `;

  document.querySelectorAll('.day[data-key]').forEach(el=>{
    el.addEventListener('click', ()=>openSheet(el.getAttribute('data-key')));
  });
  document.getElementById('prevMonth').onclick = ()=>{ changeMonth(-1); };
  document.getElementById('nextMonth').onclick = ()=>{ changeMonth(1); };
  document.getElementById('toggleMonth').onclick = ()=>{ statsScope='month'; render(); };
  document.getElementById('toggleAll').onclick = ()=>{ statsScope='all'; render(); };

  document.getElementById('exportBtn').textContent = `⇩ Export ${viewYear} to Excel`;
}

function changeMonth(delta){
  let m = viewMonth + delta;
  let y = viewYear;
  if(m<0){ m=11; y--; }
  if(m>11){ m=0; y++; }
  viewMonth = m; viewYear = y;
  render();
}

function openSheet(key){
  activeDateKey = key;
  document.getElementById('sheetDate').textContent = new Date(key+'T00:00:00').toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'long', year:'numeric'});
  const input = document.getElementById('sheetInput');
  input.value = (typeof entries[key] === 'number') ? entries[key] : '';
  document.getElementById('overlay').classList.add('open');
  setTimeout(()=>input.focus(), 150);
}
function closeSheet(){
  document.getElementById('overlay').classList.remove('open');
  activeDateKey = null;
}

async function persist(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  }catch(e){
    showToast('Could not save — try again');
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}

document.getElementById('btnSave').onclick = async ()=>{
  const val = parseFloat(document.getElementById('sheetInput').value);
  if(!activeDateKey) return;
  if(isNaN(val)){ closeSheet(); return; }
  entries[activeDateKey] = val;
  await persist();
  closeSheet();
  render();
};
document.getElementById('btnClear').onclick = async ()=>{
  if(!activeDateKey) return;
  delete entries[activeDateKey];
  await persist();
  closeSheet();
  render();
};
document.getElementById('btnCancel').onclick = closeSheet;
document.getElementById('overlay').addEventListener('click', (e)=>{
  if(e.target.id === 'overlay') closeSheet();
});

// ---------- Excel export ----------
function buildWorkbook(year){
  const yearEntries = entriesForYear(year);
  const wsData = [];
  wsData.push([`Trading Profit Tracker — ${year}`]);
  wsData.push([`Exported from the Profit Tracker app.`]);
  wsData.push([]);

  const allPnlRows = [];
  const monthPnlRows = {};

  for(let m=0;m<12;m++){
    wsData.push([`${new Date(year,m,1).toLocaleString('en-GB',{month:'long'})} ${year}`]);
    wsData.push(['Mon','Tue','Wed','Thu','Fri','Sat','Sun']);
    const weeks = getMonthMatrix(year, m);
    const rowsForMonth = [];
    weeks.forEach(week=>{
      wsData.push(week.map(c => c ? c.day : null));
      const pnlRow = week.map(c => c ? (typeof yearEntries[c.key]==='number' ? yearEntries[c.key] : null) : null);
      wsData.push(pnlRow);
      const excelRow = wsData.length; // 1-based row number of the row just pushed
      rowsForMonth.push(excelRow);
      allPnlRows.push(excelRow);
    });
    monthPnlRows[m+1] = rowsForMonth;
    wsData.push([]);
  }

  const ws = XLSX.utils.aoa_to_sheet(wsData);
  ws['!cols'] = [1,2,3,4,5,6,7].map(()=>({wch:12}));
  const moneyFmt = '£#,##0;[Red]-£#,##0;"-"';
  allPnlRows.forEach(r=>{
    for(let c=0;c<7;c++){
      const addr = XLSX.utils.encode_cell({r:r-1, c});
      if(ws[addr] && typeof ws[addr].v === 'number'){ ws[addr].z = moneyFmt; }
    }
  });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, `${year} Calendar`);

  // Statistics sheet
  const CAL = `'${year} Calendar'`;
  const ranges = allPnlRows.map(r=>`${CAL}!A${r}:G${r}`);
  const rangeList = ranges.join(',');
  const countifSum = (op,val) => allPnlRows.map(r=>`COUNTIF(${CAL}!A${r}:G${r},"${op}${val}")`).join('+');
  const sumifSum = (op,val) => allPnlRows.map(r=>`SUMIF(${CAL}!A${r}:G${r},"${op}${val}")`).join('+');

  const statsData = [];
  statsData.push([`Trading Statistics — ${year}`]);
  statsData.push([]);
  statsData.push(['Overview']);
  ['Days Traded','Winning Days','Losing Days','Win Rate','Total Profit/Loss (£)','Average Daily P&L (£)',
   'Largest Win (£)','Largest Loss (£)','Average Win (£)','Average Loss (£)','Profit Factor','Expectancy per Day (£)']
   .forEach(l=>statsData.push([l]));
  statsData.push([]);
  statsData.push(['Monthly Breakdown']);
  statsData.push(['Month','Total P&L (£)','Days Traded','Win Rate','Best Day (£)','Worst Day (£)']);
  for(let m=1;m<=12;m++) statsData.push([new Date(year,m-1,1).toLocaleString('en-GB',{month:'long'})]);

  const statsWs = XLSX.utils.aoa_to_sheet(statsData);
  statsWs['!cols'] = [{wch:26},{wch:16},{wch:12},{wch:10},{wch:12},{wch:12}];

  const R = {days:4, win:5, loss:6, winRate:7, total:8, avgDaily:9, bestAll:10, worstAll:11, avgWin:12, avgLoss:13, pf:14, exp:15};
  const setF = (addr, formula, fmt) => { statsWs[addr] = {t:'n', f:formula}; if(fmt) statsWs[addr].z = fmt; };

  setF(`B${R.days}`, `COUNT(${rangeList})`, '0');
  setF(`B${R.win}`, countifSum('>','0'), '0');
  setF(`B${R.loss}`, countifSum('<','0'), '0');
  setF(`B${R.winRate}`, `IFERROR(B${R.win}/B${R.days},0)`, '0.0%');
  setF(`B${R.total}`, `SUM(${rangeList})`, moneyFmt);
  setF(`B${R.avgDaily}`, `IFERROR(B${R.total}/B${R.days},0)`, moneyFmt);
  setF(`B${R.bestAll}`, `MAX(${rangeList})`, moneyFmt);
  setF(`B${R.worstAll}`, `MIN(${rangeList})`, moneyFmt);
  const sumWins = sumifSum('>','0');
  const sumLosses = sumifSum('<','0');
  setF(`B${R.avgWin}`, `IFERROR((${sumWins})/B${R.win},0)`, moneyFmt);
  setF(`B${R.avgLoss}`, `IFERROR((${sumLosses})/B${R.loss},0)`, moneyFmt);
  setF(`B${R.pf}`, `IFERROR((${sumWins})/ABS(${sumLosses}),0)`, '0.00');
  setF(`B${R.exp}`, `IFERROR((B${R.winRate}*B${R.avgWin})+((1-B${R.winRate})*B${R.avgLoss}),0)`, moneyFmt);

  let mr = 19;
  for(let m=1;m<=12;m++){
    const mRanges = monthPnlRows[m].map(r=>`${CAL}!A${r}:G${r}`).join(',');
    setF(`B${mr}`, `SUM(${mRanges})`, moneyFmt);
    setF(`C${mr}`, `COUNT(${mRanges})`, '0');
    const winParts = monthPnlRows[m].map(r=>`COUNTIF(${CAL}!A${r}:G${r},">0")`).join('+');
    setF(`D${mr}`, `IFERROR((${winParts})/C${mr},0)`, '0.0%');
    setF(`E${mr}`, `IFERROR(MAX(${mRanges}),0)`, moneyFmt);
    setF(`F${mr}`, `IFERROR(MIN(${mRanges}),0)`, moneyFmt);
    mr++;
  }

  XLSX.utils.book_append_sheet(wb, statsWs, 'Statistics');
  return wb;
}

document.getElementById('exportBtn').onclick = ()=>{
  try{
    const wb = buildWorkbook(viewYear);
    XLSX.writeFile(wb, `trading_profit_tracker_${viewYear}.xlsx`);
    showToast('Excel file downloaded');
  }catch(e){
    showToast('Export failed');
  }
};

async function init(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    entries = raw ? JSON.parse(raw) : {};
  }catch(e){
    entries = {};
  }
  loaded = true;
  render();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
}
init();
</script>
