<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Profit Tracker</title>
<meta name="description" content="A daily P&amp;L calendar and trading statistics tracker.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12151b">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Profit Tracker">
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#12151b;
    --panel:#181c24;
    --panel-2:#1f242e;
    --ledger-line:#252b36;
    --text:#e7eaf0;
    --muted:#8a93a3;
    --profit:#35c787;
    --profit-dim:#1f7a52;
    --loss:#ff5c5c;
    --loss-dim:#9c3535;
    --amber:#f0b429;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  #app{max-width:440px;margin:0 auto;padding:14px 14px 92px;min-height:100vh;}

  .header{padding:6px 2px 14px;}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;}
  .title{font-size:20px;font-weight:700;margin:2px 0 14px;}

  .total-card{
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--ledger-line);
    border-radius:14px;
    padding:16px 18px;
    display:flex;justify-content:space-between;align-items:flex-end;
    margin-bottom:14px;
  }
  .total-label{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;}
  .total-value{font-family:var(--mono);font-size:30px;font-weight:700;line-height:1;margin-top:6px;}
  .total-sub{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;}
  .pos{color:var(--profit);}
  .neg{color:var(--loss);}
  .zero{color:var(--muted);}

  .month-nav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px;}
  .month-nav button{
    background:var(--panel-2);border:1px solid var(--ledger-line);color:var(--text);
    width:34px;height:34px;border-radius:9px;font-size:16px;line-height:1;
  }
  .month-label{font-weight:600;font-size:15px;}

  .cal{background:var(--panel);border:1px solid var(--ledger-line);border-radius:14px;overflow:hidden;padding:8px;}
  .weekday-row{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;}
  .weekday{text-align:center;font-family:var(--mono);font-size:10px;color:var(--muted);padding:4px 0;}
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px;}
  .day{
    position:relative;aspect-ratio:1/1;border-radius:8px;border:1px solid var(--ledger-line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:var(--mono);cursor:pointer;overflow:hidden;
  }
  .day.empty{visibility:hidden;}
  .day .num{position:absolute;top:3px;left:5px;font-size:9px;color:var(--muted);}
  .day.has-num .num{color:rgba(255,255,255,.55);}
  .day .val{font-size:11px;font-weight:700;margin-top:6px;}
  .day.today{border-color:var(--amber);}
  .day .shot-badge{
    position:absolute;bottom:3px;right:4px;width:12px;height:12px;
    background:rgba(240,180,41,.9);border-radius:3px;display:flex;align-items:center;justify-content:center;
  }
  .day .shot-badge svg{width:8px;height:8px;}
  .day .dir-badge{
    position:absolute;top:3px;right:4px;font-size:8px;font-weight:700;padding:1px 3px;border-radius:3px;
    background:rgba(255,255,255,.12);color:rgba(255,255,255,.85);
  }
  .day .dir-badge.short{background:rgba(255,92,92,.25);color:#ffb0b0;}
  .day .dir-badge.long{background:rgba(53,199,135,.25);color:#a8f0cf;}
  .day .note-badge{
    position:absolute;bottom:3px;left:4px;width:5px;height:5px;border-radius:50%;
    background:rgba(255,255,255,.55);
  }

  .section-title{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:18px 2px 8px;}
  .section-title:first-child{margin-top:0;}

  .card{background:var(--panel);border:1px solid var(--ledger-line);border-radius:14px;padding:16px;margin-bottom:14px;}

  .toggle-row{display:flex;gap:6px;margin:0 0 10px;}
  .toggle{flex:1;text-align:center;padding:8px 0;border-radius:9px;border:1px solid var(--ledger-line);
    background:var(--panel);color:var(--muted);font-size:12px;font-weight:600;}
  .toggle.active{background:var(--panel-2);color:var(--text);border-color:var(--amber);}

  .stats{background:var(--panel);border:1px solid var(--ledger-line);border-radius:14px;padding:4px 14px;}
  .stat-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--ledger-line);}
  .stat-row:last-child{border-bottom:none;}
  .stat-label{font-size:12.5px;color:var(--muted);}
  .stat-value{font-family:var(--mono);font-size:13.5px;font-weight:700;}

  .streak-row{display:flex;gap:10px;}
  .streak-box{flex:1;background:var(--panel-2);border:1px solid var(--ledger-line);border-radius:12px;padding:14px;text-align:center;}
  .streak-num{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--amber);}
  .streak-label{font-size:11px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.06em;}

  .goal-input-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .goal-input-row span{font-family:var(--mono);color:var(--muted);font-size:13px;}
  .goal-input-row input{
    flex:1;background:var(--bg);border:1px solid var(--ledger-line);border-radius:9px;
    color:var(--text);font-family:var(--mono);font-size:14px;padding:9px 10px;
  }
  .goal-bar-track{background:var(--bg);border:1px solid var(--ledger-line);border-radius:8px;height:14px;overflow:hidden;}
  .goal-bar-fill{height:100%;border-radius:8px;transition:width .2s;}
  .goal-caption{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:6px;}

  .chart-empty{color:var(--muted);font-size:13px;text-align:center;padding:30px 10px;}

  .btn{
    width:100%;background:var(--panel-2);color:var(--text);border:1px solid var(--ledger-line);border-radius:11px;
    padding:12px 0;font-weight:600;font-size:13.5px;font-family:var(--sans);margin-bottom:10px;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn.amber{background:var(--amber);color:#1a1400;border:none;}
  .btn.danger-outline{color:var(--loss);}

  .tabbar{
    position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--ledger-line);
    display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:15;
  }
  .tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;color:var(--muted);}
  .tab-btn.active{color:var(--amber);}
  .tab-btn svg{width:20px;height:20px;}
  .tab-btn span{font-size:10px;font-weight:600;}

  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;
    opacity:0;pointer-events:none;transition:opacity .15s;z-index:20;
  }
  .overlay.open{opacity:1;pointer-events:auto;}
  .sheet{
    width:100%;max-width:440px;margin:0 auto;background:var(--panel-2);
    border-radius:16px 16px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(100%);transition:transform .18s;
  }
  .overlay.open .sheet{transform:translateY(0);}
  .sheet-date{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:10px;}
  .sheet input{
    width:100%;background:var(--bg);border:1px solid var(--ledger-line);border-radius:10px;
    color:var(--text);font-family:var(--mono);font-size:22px;padding:12px 14px;margin-bottom:12px;
  }
  .sheet-btns{display:flex;gap:8px;}
  .sheet-btns button{flex:1;padding:12px 0;border-radius:10px;border:none;font-weight:700;font-size:13px;font-family:var(--sans);}
  .btn-save{background:var(--amber);color:#1a1400;}
  .btn-clear{background:var(--panel);color:var(--loss);border:1px solid var(--ledger-line) !important;}
  .btn-cancel{background:var(--panel);color:var(--muted);border:1px solid var(--ledger-line) !important;}

  .sign-toggle{display:flex;gap:8px;margin-bottom:12px;}
  .sign-btn{
    flex:1;padding:12px 0;border-radius:10px;font-weight:700;font-size:14px;font-family:var(--sans);
    border:1px solid var(--ledger-line);background:var(--bg);color:var(--muted);
  }
  .sign-btn.win.active{background:rgba(53,199,135,.18);border-color:var(--profit);color:var(--profit);}
  .sign-btn.loss.active{background:rgba(255,92,92,.18);border-color:var(--loss);color:var(--loss);}

  .toast{
    position:fixed;top:14px;left:50%;transform:translateX(-50%);
    background:var(--panel-2);border:1px solid var(--ledger-line);color:var(--text);
    padding:9px 16px;border-radius:20px;font-size:12.5px;opacity:0;transition:opacity .2s;z-index:30;
  }
  .toast.show{opacity:1;}
  #fileInput{display:none;}
  #shotFileInput{display:none;}

  .menu-btns{display:flex;flex-direction:column;gap:8px;}
  .menu-btn{
    width:100%;text-align:left;background:var(--panel);border:1px solid var(--ledger-line);border-radius:11px;
    padding:13px 14px;font-weight:600;font-size:14px;color:var(--text);font-family:var(--sans);
    display:flex;align-items:center;gap:10px;
  }
  .menu-btn.danger{color:var(--loss);}
  .menu-btn-cancel{width:100%;text-align:center;background:transparent;border:none;color:var(--muted);
    padding:13px 0 0;font-size:13.5px;font-family:var(--sans);}

  .shot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0;}
  .shot-thumb{aspect-ratio:1/1;border-radius:9px;overflow:hidden;border:1px solid var(--ledger-line);background:var(--bg);}
  .shot-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .shot-empty{color:var(--muted);font-size:13px;padding:16px 0;text-align:center;}

  .month-group-title{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em;
    text-transform:uppercase;margin:16px 2px 8px;}
  .month-group-title:first-child{margin-top:0;}

  .viewer-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;flex-direction:column;
    opacity:0;pointer-events:none;transition:opacity .15s;z-index:40;
  }
  .viewer-overlay.open{opacity:1;pointer-events:auto;}
  .viewer-top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px calc(10px + env(safe-area-inset-top));}
  .viewer-date{font-family:var(--mono);font-size:12.5px;color:var(--text);}
  .viewer-close{background:var(--panel-2);border:1px solid var(--ledger-line);color:var(--text);
    width:32px;height:32px;border-radius:9px;font-size:16px;}
  .viewer-img-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:0 12px;overflow:hidden;}
  .viewer-img-wrap img{max-width:100%;max-height:100%;border-radius:8px;object-fit:contain;}
  .viewer-bottom{display:flex;gap:10px;padding:14px 16px calc(16px + env(safe-area-inset-bottom));}
  .viewer-bottom button{flex:1;padding:12px 0;border-radius:11px;border:1px solid var(--ledger-line);
    background:var(--panel-2);color:var(--text);font-weight:600;font-size:13.5px;font-family:var(--sans);}
  .viewer-bottom .viewer-delete{color:var(--loss);}

  .sign-toggle.dir-toggle .sign-btn.long.active{background:rgba(53,199,135,.18);border-color:var(--profit);color:var(--profit);}
  .sign-toggle.dir-toggle .sign-btn.short.active{background:rgba(255,92,92,.18);border-color:var(--loss);color:var(--loss);}

  .tag-chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .tag-chip{
    padding:8px 12px;border-radius:20px;border:1px solid var(--ledger-line);background:var(--bg);
    color:var(--muted);font-size:12.5px;font-family:var(--sans);
  }
  .tag-chip.active{background:rgba(240,180,41,.18);border-color:var(--amber);color:var(--amber);}

  .note-textarea{
    width:100%;background:var(--bg);border:1px solid var(--ledger-line);border-radius:10px;
    color:var(--text);font-family:var(--sans);font-size:14px;padding:12px;min-height:90px;
    resize:vertical;margin-bottom:14px;
  }
  .field-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}

  .heatmap-scroll{overflow-x:auto;padding-bottom:4px;}
  .heatmap-grid{
    display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:9px;gap:2px;
    width:max-content;
  }
  .heatmap-cell{width:9px;height:9px;border-radius:2px;background:var(--ledger-line);}
  .heatmap-months{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;
    color:var(--muted);margin-bottom:6px;padding:0 2px;}

  .equity-wrap{display:flex;gap:4px;}
  .equity-yaxis{position:relative;width:42px;flex-shrink:0;height:200px;}
  .equity-yaxis span{position:absolute;right:4px;transform:translateY(-50%);
    font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap;}
  .equity-scroll{overflow-x:auto;flex:1;-webkit-overflow-scrolling:touch;}
  .equity-scroll svg{display:block;}
  .equity-hint{font-size:10.5px;color:var(--muted);text-align:right;margin-top:6px;}
</style>

<div id="app"></div>

    <div class="sign-toggle">

<script>
const NEW_KEY = 'pnl-data';
const OLD_KEY = 'pnl-entries';
const now = new Date();
let entries = {};
let settings = { monthlyTarget: 0 };
let viewYear = now.getFullYear();
let viewMonth = now.getMonth();
let statsScope = 'month';
let activeTab = 'calendar'; // calendar | trends | screenshots
let activeDateKey = null;
let activeSign = 1;
let screenshotCounts = {}; // dateKey -> count
let allScreenshotsCache = null; // array of {id,dateKey,blob,addedAt,url}, loaded lazily
let currentShotUrls = []; // object URLs to revoke on next open
let viewerCurrent = null; // {id, dateKey, url}
let db = null;

function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open('profit-tracker-db', 1);
    req.onupgradeneeded = (e)=>{
      const _db = e.target.result;
      if(!_db.objectStoreNames.contains('screenshots')){
        const store = _db.createObjectStore('screenshots', {keyPath:'id'});
        store.createIndex('dateKey','dateKey',{unique:false});
      }
    };
    req.onsuccess = (e)=> resolve(e.target.result);
    req.onerror = ()=> reject(req.error);
  });
}
function dbAddScreenshot(dateKey, blob){
  return new Promise((resolve,reject)=>{
    const id = (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(36).slice(2));
    const tx = db.transaction('screenshots','readwrite');
    tx.objectStore('screenshots').add({id, dateKey, blob, addedAt: Date.now()});
    tx.oncomplete = ()=> resolve(id);
    tx.onerror = ()=> reject(tx.error);
  });
}
function dbDeleteScreenshot(id){
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('screenshots','readwrite');
    tx.objectStore('screenshots').delete(id);
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  });
}
function dbGetForDate(dateKey){
  return new Promise((resolve)=>{
    const tx = db.transaction('screenshots','readonly');
    const req = tx.objectStore('screenshots').index('dateKey').getAll(dateKey);
    req.onsuccess = ()=> resolve(req.result || []);
    req.onerror = ()=> resolve([]);
  });
}
function dbGetAll(){
  return new Promise((resolve)=>{
    const tx = db.transaction('screenshots','readonly');
    const req = tx.objectStore('screenshots').getAll();
    req.onsuccess = ()=> resolve(req.result || []);
    req.onerror = ()=> resolve([]);
  });
}
async function loadScreenshotIndex(){
  const all = await dbGetAll();
  const counts = {};
  all.forEach(r=>{ counts[r.dateKey] = (counts[r.dateKey]||0)+1; });
  screenshotCounts = counts;
}
async function compressImage(file, maxDim=1280, quality=0.72){
  const bitmap = await createImageBitmap(file);
  let {width, height} = bitmap;
  if(width > maxDim || height > maxDim){
    const scale = maxDim/Math.max(width,height);
    width = Math.round(width*scale); height = Math.round(height*scale);
  }
  const canvas = document.createElement('canvas');
  canvas.width = width; canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(bitmap, 0, 0, width, height);
  return await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
}

const fmtGBP = (v, forceSign=false) => {
  const abs = Math.abs(Math.round(v));
  const s = '£' + abs.toLocaleString('en-GB');
  if (v > 0) return (forceSign ? '+' : '') + s;
  if (v < 0) return '-' + s;
  return s;
};
const pad2 = n => String(n).padStart(2,'0');
const dateKey = (y,m,d) => `${y}-${pad2(m+1)}-${pad2(d)}`;

function getMonthMatrix(year, month){
  const first = new Date(year, month, 1);
  const startWeekday = (first.getDay() + 6) % 7;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const cells = [];
  for(let i=0;i<startWeekday;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push({day:d, key:dateKey(year,month,d)});
  while(cells.length % 7 !== 0) cells.push(null);
  const weeks = [];
  for(let i=0;i<cells.length;i+=7) weeks.push(cells.slice(i,i+7));
  return weeks;
}

function computeStats(scopeEntries){
  const vals = Object.values(scopeEntries).map(r=>r.pnl).filter(v => typeof v === 'number' && !isNaN(v));
  const wins = vals.filter(v=>v>0);
  const losses = vals.filter(v=>v<0);
  const daysTraded = vals.length;
  const total = vals.reduce((a,b)=>a+b,0);
  const winRate = daysTraded ? wins.length/daysTraded : 0;
  const avgDaily = daysTraded ? total/daysTraded : 0;
  const sumWins = wins.reduce((a,b)=>a+b,0);
  const sumLosses = losses.reduce((a,b)=>a+b,0);
  const avgWin = wins.length ? sumWins/wins.length : 0;
  const avgLoss = losses.length ? sumLosses/losses.length : 0;
  const best = vals.length ? Math.max(...vals) : 0;
  const worst = vals.length ? Math.min(...vals) : 0;
  const profitFactor = sumLosses !== 0 ? sumWins/Math.abs(sumLosses) : (sumWins>0 ? Infinity : 0);
  const expectancy = (winRate*avgWin) + ((1-winRate)*avgLoss);
  return {daysTraded, winDays:wins.length, lossDays:losses.length, winRate, total, avgDaily, avgWin, avgLoss, best, worst, profitFactor, expectancy};
}

function computeStreaks(allEntries){
  const sortedKeys = Object.keys(allEntries).filter(k=>typeof allEntries[k].pnl === 'number').sort();
  let longest = 0, run = 0;
  sortedKeys.forEach(k=>{
    if(allEntries[k].pnl > 0){ run++; longest = Math.max(longest, run); }
    else { run = 0; }
  });
  let current = 0;
  for(let i=sortedKeys.length-1;i>=0;i--){
    if(allEntries[sortedKeys[i]].pnl > 0) current++; else break;
  }
  return { current, longest };
}
function computeDrawdown(scopeEntries){
  const sortedKeys = Object.keys(scopeEntries).filter(k=>typeof scopeEntries[k].pnl === 'number').sort();
  let running = 0, peak = 0, maxDD = 0, maxDDPct = 0;
  sortedKeys.forEach(k=>{
    running += scopeEntries[k].pnl;
    if(running > peak) peak = running;
    const dd = peak - running;
    if(dd > maxDD){
      maxDD = dd;
      maxDDPct = peak !== 0 ? (dd/Math.abs(peak))*100 : 0;
    }
  });
  return { maxDD, maxDDPct };
}

function entriesForMonth(y,m){
  const prefix = `${y}-${pad2(m+1)}-`;
  const out = {};
  Object.keys(entries).forEach(k=>{ if(k.startsWith(prefix)) out[k]=entries[k]; });
  return out;
}
function entriesForYear(y){
  const prefix = `${y}-`;
  const out = {};
  Object.keys(entries).forEach(k=>{ if(k.startsWith(prefix)) out[k]=entries[k]; });
  return out;
}

function maxAbsAll(){
  const vals = Object.values(entries).map(r=>r.pnl).filter(v=>typeof v==='number');
  if(!vals.length) return 100;
  return Math.max(...vals.map(v=>Math.abs(v)), 1);
}
function pnlBg(v, maxAbs){
  if(v === undefined || v === null) return 'transparent';
  const alpha = Math.min(0.85, 0.15 + 0.7*Math.abs(v)/maxAbs);
  return v >= 0 ? `rgba(53,199,135,${alpha})` : `rgba(255,92,92,${alpha})`;
}
function monthLabel(y,m){
  return new Date(y,m,1).toLocaleString('en-GB',{month:'long', year:'numeric'});
}

function buildEquityCurveSVG(yearEntries){
  const sortedKeys = Object.keys(yearEntries).filter(k=>typeof yearEntries[k].pnl === 'number').sort();
  if(sortedKeys.length === 0) return null;
  let running = 0;
  const points = sortedKeys.map(k=>{ running += yearEntries[k].pnl; return running; });
  const minV = Math.min(0, ...points);
  const maxV = Math.max(0, ...points);
  const range = (maxV - minV) || 1;

  const pointSpacing = 34; // px per data point — more points = wider chart = scrollable
  const padL = 10, padR = 20, padT = 16, padB = 26;
  const plotW = Math.max(300, (points.length-1) * pointSpacing);
  const width = plotW + padL + padR;
  const height = 200;
  const plotH = height - padT - padB;

  const coords = points.map((v,i)=>{
    const x = padL + (points.length > 1 ? i*(plotW/(points.length-1)) : 0);
    const y = padT + plotH - ((v - minV)/range)*plotH;
    return [x,y];
  });
  const zeroY = padT + plotH - ((0 - minV)/range)*plotH;
  const linePath = coords.map((p,i)=> (i===0?'M':'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const areaPath = linePath + ` L${coords[coords.length-1][0].toFixed(1)},${zeroY.toFixed(1)} L${coords[0][0].toFixed(1)},${zeroY.toFixed(1)} Z`;
  const finalPositive = points[points.length-1] >= 0;
  const lineColor = finalPositive ? '#35c787' : '#ff5c5c';
  const fillColor = finalPositive ? 'rgba(53,199,135,0.12)' : 'rgba(255,92,92,0.12)';
  const lastPoint = coords[coords.length-1];

  // x-axis date labels — cap how many we draw so they don't overlap
  const maxLabels = 10;
  const step = Math.max(1, Math.ceil(sortedKeys.length / maxLabels));
  let xLabels = '';
  sortedKeys.forEach((k,i)=>{
    if(i % step === 0 || i === sortedKeys.length-1){
      const d = new Date(k+'T00:00:00');
      const label = d.toLocaleDateString('en-GB',{day:'numeric', month:'short'});
      xLabels += `<text x="${coords[i][0].toFixed(1)}" y="${height-8}" font-size="9" fill="#8a93a3" text-anchor="middle" font-family="ui-monospace,monospace">${label}</text>`;
      xLabels += `<line x1="${coords[i][0].toFixed(1)}" y1="${padT}" x2="${coords[i][0].toFixed(1)}" y2="${height-padB}" stroke="#1c212b" stroke-width="1"/>`;
    }
  });

  const svg = `<svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" xmlns="http://www.w3.org/2000/svg">
    ${xLabels}
    <line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${width-padR}" y2="${zeroY.toFixed(1)}" stroke="#3a4252" stroke-width="1" stroke-dasharray="3,3"/>
    <path d="${areaPath}" fill="${fillColor}" stroke="none"/>
    <path d="${linePath}" fill="none" stroke="${lineColor}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${lastPoint[0].toFixed(1)}" cy="${lastPoint[1].toFixed(1)}" r="4" fill="${lineColor}"/>
  </svg>`;

  return { svg, width, height, maxV, minV, zeroY, padT, plotBottom: height - padB };
}

function buildYearHeatmap(year){
  const maxAbs = maxAbsAll();
  const startWeekday = (new Date(year,0,1).getDay() + 6) % 7; // Mon=0
  const isLeap = (year%4===0 && year%100!==0) || year%400===0;
  const daysInYear = isLeap ? 366 : 365;
  let cells = '';
  for(let i=0;i<startWeekday;i++){
    cells += `<div class="heatmap-cell" style="background:transparent"></div>`;
  }
  for(let d=0; d<daysInYear; d++){
    const date = new Date(year,0,1+d);
    const key = dateKey(date.getFullYear(), date.getMonth(), date.getDate());
    const rec = entries[key];
    const v = rec ? rec.pnl : undefined;
    const bg = typeof v === 'number' ? pnlBg(v, maxAbs) : 'var(--ledger-line)';
    cells += `<div class="heatmap-cell" style="background:${bg}" data-heat-key="${key}"></div>`;
  }
  return cells;
}

function renderScreenshotsTab(){
  if(allScreenshotsCache === null){
    dbGetAll().then(all=>{
      all.sort((a,b)=> b.dateKey.localeCompare(a.dateKey) || b.addedAt - a.addedAt);
      currentShotUrls.forEach(u=>URL.revokeObjectURL(u));
      currentShotUrls = [];
      all.forEach(r=>{ r.url = URL.createObjectURL(r.blob); currentShotUrls.push(r.url); });
      allScreenshotsCache = all;
      if(activeTab === 'screenshots') render();
    });
    return `<div class="chart-empty">Loading screenshots…</div>`;
  }

  if(allScreenshotsCache.length === 0){
    return `<div class="card"><div class="chart-empty">No screenshots yet.<br>Long-press any day on the calendar and choose "Screenshots" to add one.</div></div>`;
  }

  const groups = {};
  allScreenshotsCache.forEach(r=>{
    const gk = r.dateKey.slice(0,7);
    if(!groups[gk]) groups[gk] = [];
    groups[gk].push(r);
  });
  const groupKeys = Object.keys(groups).sort().reverse();

  return groupKeys.map(gk=>{
    const [y,m] = gk.split('-').map(Number);
    const label = new Date(y, m-1, 1).toLocaleString('en-GB',{month:'long', year:'numeric'});
    return `
      <div class="month-group-title">${label}</div>
      <div class="shot-grid">
        ${groups[gk].map(r=>`
          <div class="shot-thumb" data-shot-id="${r.id}"><img src="${r.url}" loading="lazy"/></div>
        `).join('')}
      </div>
    `;
  }).join('');
}

function wireEvents(){
  document.querySelectorAll('.day[data-key]').forEach(el=>{
    let pressTimer = null;
    let longPressFired = false;
    el.addEventListener('pointerdown', ()=>{
      longPressFired = false;
      pressTimer = setTimeout(()=>{ longPressFired = true; openDayMenu(el.getAttribute('data-key')); }, 500);
    });
    ['pointerup','pointercancel','pointerleave'].forEach(evt=>{
      el.addEventListener(evt, ()=> clearTimeout(pressTimer));
    });
    el.addEventListener('contextmenu', (ev)=> ev.preventDefault());
    el.addEventListener('click', ()=>{
      if(longPressFired){ longPressFired = false; return; }
      openSheet(el.getAttribute('data-key'));
    });
  });

  document.querySelectorAll('.shot-thumb[data-shot-id]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-shot-id');
      const rec = allScreenshotsCache && allScreenshotsCache.find(r=>r.id===id);
      if(rec) openViewer(rec, ()=>{ allScreenshotsCache = null; render(); });
    });
  });

  document.querySelectorAll('.heatmap-cell[data-heat-key]').forEach(el=>{
    el.addEventListener('click', ()=> openDayMenu(el.getAttribute('data-heat-key')));
  });

  const prevBtn = document.getElementById('prevMonth');
  const nextBtn = document.getElementById('nextMonth');
  if(prevBtn) prevBtn.onclick = ()=> changeMonth(-1);
  if(nextBtn) nextBtn.onclick = ()=> changeMonth(1);

  const tm = document.getElementById('toggleMonth');
  const ta = document.getElementById('toggleAll');
  if(tm) tm.onclick = ()=>{ statsScope='month'; render(); };
  if(ta) ta.onclick = ()=>{ statsScope='all'; render(); };

  const goalInput = document.getElementById('goalInput');
  if(goalInput){
    goalInput.addEventListener('change', async ()=>{
      const val = parseFloat(goalInput.value);
      settings.monthlyTarget = isNaN(val) ? 0 : val;
      await persist();
      render();
    });
  }

  const exportExcelBtn = document.getElementById('exportExcelBtn');
  if(exportExcelBtn) exportExcelBtn.onclick = doExportExcel;
  const exportBackupBtn = document.getElementById('exportBackupBtn');
  if(exportBackupBtn) exportBackupBtn.onclick = doExportBackup;
  const importBackupBtn = document.getElementById('importBackupBtn');
  if(importBackupBtn) importBackupBtn.onclick = ()=> document.getElementById('fileInput').click();

  document.querySelectorAll('.tab-btn').forEach(el=>{
    el.addEventListener('click', ()=>{ activeTab = el.getAttribute('data-tab'); render(); });
  });
}

function changeMonth(delta){
  let m = viewMonth + delta;
  let y = viewYear;
  if(m<0){ m=11; y--; }
  if(m>11){ m=0; y++; }
  viewMonth = m; viewYear = y;
  render();
}

function openSheet(key){
  activeDateKey = key;
  document.getElementById('sheetDate').textContent = new Date(key+'T00:00:00').toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'long', year:'numeric'});
  const existing = entries[key];
  const existingPnl = existing ? existing.pnl : undefined;
  activeSign = (typeof existingPnl === 'number' && existingPnl < 0) ? -1 : 1;
  updateSignButtons();
  const input = document.getElementById('sheetInput');
  input.value = (typeof existingPnl === 'number') ? Math.abs(existingPnl) : '';
  document.getElementById('overlay').classList.add('open');
  setTimeout(()=>input.focus(), 150);
}

}
function updateDirButtons(){
  document.getElementById('dirLong').classList.toggle('active', detailsDirection === 'long');
  document.getElementById('dirShort').classList.toggle('active', detailsDirection === 'short');
}
document.getElementById('dirLong').onclick = ()=>{ detailsDirection = (detailsDirection==='long') ? null : 'long'; updateDirButtons(); };
document.getElementById('dirShort').onclick = ()=>{ detailsDirection = (detailsDirection==='short') ? null : 'short'; updateDirButtons(); };

function openDetailsSheet(key){
  activeDateKey = key;
  const existing = entries[key] || {};
  detailsDirection = existing.direction || null;
  detailsTags = existing.tags ? [...existing.tags] : [];
  updateDirButtons();
  renderTagChips();
  document.getElementById('detailsSheetDate').textContent = friendlyDate(key);
  document.getElementById('noteTextarea').value = existing.note || '';
  document.getElementById('detailsOverlay').classList.add('open');
}
function closeDetailsSheet(){
  document.getElementById('detailsOverlay').classList.remove('open');
}
document.getElementById('detailsCancel').onclick = closeDetailsSheet;
document.getElementById('detailsOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'detailsOverlay') closeDetailsSheet();
});
document.getElementById('detailsSave').onclick = async ()=>{
  if(!activeDateKey) return;
  const existing = entries[activeDateKey] || {};
  const note = document.getElementById('noteTextarea').value.trim();
  const updated = { ...existing, direction: detailsDirection, tags: detailsTags, note };
  entries[activeDateKey] = updated;
  await persist();
  closeDetailsSheet();
  render();
  showToast('Details saved');
};

// ---------- Per-day screenshot sheet ----------
function renderShotGrid(records){
  const container = document.getElementById('shotGridContainer');
  if(!records.length){
    container.innerHTML = `<div class="shot-empty">No screenshots for this day yet.</div>`;
    return;
  }
  container.innerHTML = `<div class="shot-grid">
    ${records.map(r=>`<div class="shot-thumb" data-day-shot-id="${r.id}"><img src="${r.url}"/></div>`).join('')}
  </div>`;
  container.querySelectorAll('.shot-thumb[data-day-shot-id]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-day-shot-id');
      const rec = records.find(r=>r.id===id);
      if(rec) openViewer(rec, async ()=>{
        allScreenshotsCache = null;
        const fresh = await dbGetForDate(activeDateKey);
        fresh.forEach(r=> r.url = URL.createObjectURL(r.blob));
        renderShotGrid(fresh);
        render();
      });
    });
  });
}
async function openScreenshotSheet(key){
  activeDateKey = key;
  document.getElementById('shotSheetDate').textContent = friendlyDate(key);
  document.getElementById('shotGridContainer').innerHTML = `<div class="shot-empty">Loading…</div>`;
  document.getElementById('shotOverlay').classList.add('open');
  currentShotUrls.forEach(u=>URL.revokeObjectURL(u));
  currentShotUrls = [];
  const records = await dbGetForDate(key);
  records.forEach(r=>{ r.url = URL.createObjectURL(r.blob); currentShotUrls.push(r.url); });
  if(activeDateKey === key) renderShotGrid(records);
}
function closeScreenshotSheet(){
  document.getElementById('shotOverlay').classList.remove('open');
}
document.getElementById('shotSheetClose').onclick = closeScreenshotSheet;
document.getElementById('shotOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'shotOverlay') closeScreenshotSheet();
});
document.getElementById('shotAddBtn').onclick = ()=> document.getElementById('shotFileInput').click();
document.getElementById('shotFileInput').addEventListener('change', async (e)=>{
  const files = Array.from(e.target.files || []);
  if(!files.length || !activeDateKey) return;
  showToast('Adding…');
  const key = activeDateKey;
  for(const file of files){
    try{
      const blob = await compressImage(file);
      await dbAddScreenshot(key, blob);
      screenshotCounts[key] = (screenshotCounts[key]||0) + 1;
    }catch(err){ /* skip file on failure */ }
  }
  allScreenshotsCache = null;
  const fresh = await dbGetForDate(key);
  fresh.forEach(r=>{ r.url = URL.createObjectURL(r.blob); currentShotUrls.push(r.url); });
  renderShotGrid(fresh);
  render();
  showToast('Screenshots added');
  e.target.value = '';
});

// ---------- Full-screen viewer ----------
function openViewer(rec, onDeleted){
  viewerCurrent = rec;
  document.getElementById('viewerDate').textContent = friendlyDate(rec.dateKey);
  document.getElementById('viewerImg').src = rec.url;
  document.getElementById('viewerOverlay').classList.add('open');
  document.getElementById('viewerGoToDay').onclick = ()=>{
    const [y,m] = rec.dateKey.split('-').map(Number);
    viewYear = y; viewMonth = m-1;
    activeTab = 'calendar';
    closeViewer();
    closeScreenshotSheet();
    render();
  };
  document.getElementById('viewerDelete').onclick = async ()=>{
    const ok = confirm('Delete this screenshot?');
    if(!ok) return;
    await dbDeleteScreenshot(rec.id);
    screenshotCounts[rec.dateKey] = Math.max(0, (screenshotCounts[rec.dateKey]||1) - 1);
    if(screenshotCounts[rec.dateKey] === 0) delete screenshotCounts[rec.dateKey];
    closeViewer();
    if(onDeleted) onDeleted();
    showToast('Screenshot deleted');
  };
}
function closeViewer(){
  document.getElementById('viewerOverlay').classList.remove('open');
  viewerCurrent = null;
}
document.getElementById('viewerCloseBtn').onclick = closeViewer;

function updateSignButtons(){
  document.getElementById('signWin').classList.toggle('active', activeSign === 1);
  document.getElementById('signLoss').classList.toggle('active', activeSign === -1);
}
function closeSheet(){
  document.getElementById('overlay').classList.remove('open');
  activeDateKey = null;
}
document.getElementById('signWin').onclick = ()=>{ activeSign = 1; updateSignButtons(); };
document.getElementById('signLoss').onclick = ()=>{ activeSign = -1; updateSignButtons(); };

async function persist(){
  try{
    localStorage.setItem(NEW_KEY, JSON.stringify({ entries, settings }));
  }catch(e){
    showToast('Could not save — try again');
  }
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

document.getElementById('btnSave').onclick = async ()=>{
  const raw = parseFloat(document.getElementById('sheetInput').value);
  if(!activeDateKey) return;
  if(isNaN(raw)){ closeSheet(); return; }
  const existing = entries[activeDateKey] || {};
  entries[activeDateKey] = { ...existing, pnl: Math.abs(raw) * activeSign };
  await persist();
  closeSheet();
  render();
};
document.getElementById('btnClear').onclick = async ()=>{
  if(!activeDateKey) return;
  const existing = entries[activeDateKey];
  if(existing && ((existing.note && existing.note.trim()) || (existing.tags && existing.tags.length) || existing.direction)){
    // keep notes/tags/direction, just clear the P&L figure
    delete existing.pnl;
    entries[activeDateKey] = existing;
  } else {
    delete entries[activeDateKey];
  }
  await persist();
  closeSheet();
  render();
};
document.getElementById('btnCancel').onclick = closeSheet;
document.getElementById('overlay').addEventListener('click', (e)=>{
  if(e.target.id === 'overlay') closeSheet();
});

// ---------- Backup / restore ----------
function doExportBackup(){
  const payload = { entries, settings, exportedAt: new Date().toISOString(), app: 'profit-tracker' };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `profit-tracker-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('Backup downloaded');
}

document.getElementById('fileInput').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (evt)=>{
    try{
      const parsed = JSON.parse(evt.target.result);
      if(!parsed.entries) throw new Error('bad format');
      const ok = confirm('This will overwrite your current data with the backup. Continue?');
      if(!ok) return;
      entries = parsed.entries || {};
      settings = parsed.settings || { monthlyTarget: 0 };
      Object.keys(entries).forEach(k=>{
        if(typeof entries[k] === 'number') entries[k] = { pnl: entries[k] };
      });
      await persist();
      render();
      showToast('Backup restored');
    }catch(err){
      showToast('Could not read that backup file');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

// ---------- Excel export ----------
function buildWorkbook(year){
  const yearEntries = entriesForYear(year);
  const wsData = [];
  wsData.push([`Trading Profit Tracker — ${year}`]);
  wsData.push([`Exported from the Profit Tracker app.`]);
  wsData.push([]);

  const allPnlRows = [];
  const monthPnlRows = {};

  for(let m=0;m<12;m++){
    wsData.push([`${new Date(year,m,1).toLocaleString('en-GB',{month:'long'})} ${year}`]);
    wsData.push(['Mon','Tue','Wed','Thu','Fri','Sat','Sun']);
    const weeks = getMonthMatrix(year, m);
    const rowsForMonth = [];
    weeks.forEach(week=>{
      wsData.push(week.map(c => c ? c.day : null));
      const pnlRow = week.map(c => c ? (yearEntries[c.key] && typeof yearEntries[c.key].pnl==='number' ? yearEntries[c.key].pnl : null) : null);
      wsData.push(pnlRow);
      const excelRow = wsData.length;
      rowsForMonth.push(excelRow);
      allPnlRows.push(excelRow);
    });
    monthPnlRows[m+1] = rowsForMonth;
    wsData.push([]);
  }

  const ws = XLSX.utils.aoa_to_sheet(wsData);
  ws['!cols'] = [1,2,3,4,5,6,7].map(()=>({wch:12}));
  const moneyFmt = '£#,##0;[Red]-£#,##0;"-"';
  allPnlRows.forEach(r=>{
    for(let c=0;c<7;c++){
      const addr = XLSX.utils.encode_cell({r:r-1, c});
      if(ws[addr] && typeof ws[addr].v === 'number'){ ws[addr].z = moneyFmt; }
    }
  });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, `${year} Calendar`);

  const CAL = `'${year} Calendar'`;
  const ranges = allPnlRows.map(r=>`${CAL}!A${r}:G${r}`);
  const rangeList = ranges.join(',');
  const countifSum = (op,val) => allPnlRows.map(r=>`COUNTIF(${CAL}!A${r}:G${r},"${op}${val}")`).join('+');
  const sumifSum = (op,val) => allPnlRows.map(r=>`SUMIF(${CAL}!A${r}:G${r},"${op}${val}")`).join('+');

  const statsData = [];
  statsData.push([`Trading Statistics — ${year}`]);
  statsData.push([]);
  statsData.push(['Overview']);
  ['Days Traded','Winning Days','Losing Days','Win Rate','Total Profit/Loss (£)','Average Daily P&L (£)',
   'Largest Win (£)','Largest Loss (£)','Average Win (£)','Average Loss (£)','Profit Factor','Expectancy per Day (£)']
   .forEach(l=>statsData.push([l]));
  statsData.push([]);
  statsData.push(['Monthly Breakdown']);
  statsData.push(['Month','Total P&L (£)','Days Traded','Win Rate','Best Day (£)','Worst Day (£)']);
  for(let m=1;m<=12;m++) statsData.push([new Date(year,m-1,1).toLocaleString('en-GB',{month:'long'})]);

  const statsWs = XLSX.utils.aoa_to_sheet(statsData);
  statsWs['!cols'] = [{wch:26},{wch:16},{wch:12},{wch:10},{wch:12},{wch:12}];

  const R = {days:4, win:5, loss:6, winRate:7, total:8, avgDaily:9, bestAll:10, worstAll:11, avgWin:12, avgLoss:13, pf:14, exp:15};
  const setF = (addr, formula, fmt) => { statsWs[addr] = {t:'n', f:formula}; if(fmt) statsWs[addr].z = fmt; };

  setF(`B${R.days}`, `COUNT(${rangeList})`, '0');
  setF(`B${R.win}`, countifSum('>','0'), '0');
  setF(`B${R.loss}`, countifSum('<','0'), '0');
  setF(`B${R.winRate}`, `IFERROR(B${R.win}/B${R.days},0)`, '0.0%');
  setF(`B${R.total}`, `SUM(${rangeList})`, moneyFmt);
  setF(`B${R.avgDaily}`, `IFERROR(B${R.total}/B${R.days},0)`, moneyFmt);
  setF(`B${R.bestAll}`, `MAX(${rangeList})`, moneyFmt);
  setF(`B${R.worstAll}`, `MIN(${rangeList})`, moneyFmt);
  const sumWins = sumifSum('>','0');
  const sumLosses = sumifSum('<','0');
  setF(`B${R.avgWin}`, `IFERROR((${sumWins})/B${R.win},0)`, moneyFmt);
  setF(`B${R.avgLoss}`, `IFERROR((${sumLosses})/B${R.loss},0)`, moneyFmt);
  setF(`B${R.pf}`, `IFERROR((${sumWins})/ABS(${sumLosses}),0)`, '0.00');
  setF(`B${R.exp}`, `IFERROR((B${R.winRate}*B${R.avgWin})+((1-B${R.winRate})*B${R.avgLoss}),0)`, moneyFmt);

  let mr = 19;
  for(let m=1;m<=12;m++){
    const mRanges = monthPnlRows[m].map(r=>`${CAL}!A${r}:G${r}`).join(',');
    setF(`B${mr}`, `SUM(${mRanges})`, moneyFmt);
    setF(`C${mr}`, `COUNT(${mRanges})`, '0');
    const winParts = monthPnlRows[m].map(r=>`COUNTIF(${CAL}!A${r}:G${r},">0")`).join('+');
    setF(`D${mr}`, `IFERROR((${winParts})/C${mr},0)`, '0.0%');
    setF(`E${mr}`, `IFERROR(MAX(${mRanges}),0)`, moneyFmt);
    setF(`F${mr}`, `IFERROR(MIN(${mRanges}),0)`, moneyFmt);
    mr++;
  }

  XLSX.utils.book_append_sheet(wb, statsWs, 'Statistics');
  return wb;
}

function doExportExcel(){
  try{
    const wb = buildWorkbook(viewYear);
    XLSX.writeFile(wb, `trading_profit_tracker_${viewYear}.xlsx`);
    showToast('Excel file downloaded');
  }catch(e){
    showToast('Export failed');
  }
}

async function init(){
  try{
    const raw = localStorage.getItem(NEW_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      entries = parsed.entries || {};
      settings = parsed.settings || { monthlyTarget: 0 };
    } else {
      const oldRaw = localStorage.getItem(OLD_KEY);
      if(oldRaw){
        entries = JSON.parse(oldRaw) || {};
        settings = { monthlyTarget: 0 };
        await persist();
        localStorage.removeItem(OLD_KEY);
      }
    }
  }catch(e){
    entries = {}; settings = { monthlyTarget: 0 };
  }

  // migrate any legacy plain-number entries to the {pnl, direction, tags, note} shape
  let migrated = false;
  Object.keys(entries).forEach(k=>{
    if(typeof entries[k] === 'number'){
      entries[k] = { pnl: entries[k] };
      migrated = true;
    }
  });
  if(migrated) await persist();

  try{
    db = await openDB();
    await loadScreenshotIndex();
  }catch(e){
    // screenshots feature unavailable (e.g. private browsing); app still works without it
  }

  render();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
}
init();
</script>
